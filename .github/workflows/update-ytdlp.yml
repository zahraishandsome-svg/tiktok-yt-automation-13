name: Auto-update yt-dlp

on:
  schedule:
    # Every day at 6:00 AM UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install version helper
        run: pip install --quiet packaging

      - name: Get latest yt-dlp version
        id: latest
        run: |
          # Track NIGHTLY builds. TikTok fixes ship there first — the stable
          # channel sat on 2026.7.4 for six weeks while every upload failed.
          LATEST=$(curl -s https://pypi.org/pypi/yt-dlp/json | python3 -c "
          import sys, json
          from packaging.version import Version
          rel = json.load(sys.stdin)['releases']
          print(max(rel, key=Version))")
          echo "version=$LATEST" >> $GITHUB_OUTPUT
          echo "Latest yt-dlp: $LATEST"

      - name: Get current pinned version
        id: current
        run: |
          CURRENT=$(grep '^yt-dlp' requirements.txt | grep -oP '(?<=>=)[\w.]+$')
          echo "version=$CURRENT" >> $GITHUB_OUTPUT
          echo "Current yt-dlp: $CURRENT"

      - name: Commit and push
        if: steps.update.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add requirements.txt
          git commit -m "chore: bump yt-dlp to ${{ steps.latest.outputs.version }}"
          git push

